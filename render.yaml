services:
  - type: web
    name: truck-tracker-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: APP_BASE_URL
        sync: false
      - key: ENVIRONMENT
        value: production
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-5-5
      - key: ANTHROPIC_EFFORT
        value: low
      - key: TRANSCRIPTION_API_KEY
        sync: false
      - key: TRANSCRIPTION_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: TRANSCRIPTION_MODEL
        value: whisper-large-v3
      - key: PYTHON_VERSION
        value: 3.12.10
